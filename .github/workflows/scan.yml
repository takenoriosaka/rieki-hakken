name: Scan and Publish Dashboard

# 手動実行（workflow_dispatch）でのみ、スキャン→ダッシュボード再生成→GitHub Pagesへpushする。
# 定期実行（schedule / cron）は自動調査が不要になったため廃止した。
# main.py が「スキャン→DB保存→docs/ 再生成→git add/commit/push」まで
# すべて自前で行う設計なので、このワークフローは main.py を実行するだけでよい
# （Actions側で別途 git commit/push は行わない。二重pushを避けるため）。

on:
  workflow_dispatch: {}

# 手動実行が重なって git push が衝突しないようにする
concurrency:
  group: rieki-hakken-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # GitHub-hosted runner の上限は 360分。通常は 90分以内に終わる想定だが、
    # メルカリ側が遅い日でも途中で打ち切られないよう余裕を持たせる
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        run: playwright install --with-deps chromium

      # arbitrage.db は .gitignore 対象でリポジトリにはコミットされないため、
      # 何もしなければ Actions の実行ごとに DB が空の状態からスタートしてしまい、
      # ダッシュボードの「直近7日間の履歴表示」(database.load_scan_deals(days=7)) や
      # 相場キャッシュ(price_cache_hours)が機能しなくなる。
      # actions/cache で arbitrage.db を実行間で引き継ぐことでこれを回避する。
      - name: Restore arbitrage.db cache
        uses: actions/cache@v4
        with:
          path: arbitrage.db
          key: arbitrage-db-${{ github.run_id }}
          restore-keys: |
            arbitrage-db-

      - name: Configure git identity for auto-commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # main.py が中でスキャン→DB保存→generate_dashboard.py実行→
      # git add docs/*→git commit→git push まで自動で行う。
      # 変更がない場合は内部の `git commit` がエラーになるだけで
      # (main.py 側で except CalledProcessError により握りつぶされ、
      # 空コミットにはならず、ジョブ自体も失敗しない)、
      # そのため Actions 側で追加の git diff / commit / push は行わない。
      - name: Run scan (scan -> DB save -> dashboard regenerate -> git push)
        # 出力をバッファせず即時に出す（ログのタイムスタンプで所要時間を分析できるように）
        env:
          PYTHONUNBUFFERED: "1"
        run: python main.py
